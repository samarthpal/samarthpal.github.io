<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- per-page title / description / canonical / og:* are rewritten for every route at build time (vite.config.js → staticPages) -->
    <title>Samarth Pal — Co-founder &amp; CTO, DaemonHive Technologies</title>
    <meta name="title" content="Samarth Pal — Co-founder &amp; CTO, DaemonHive Technologies" />
    <meta
      name="description"
      content="Samarth Kumar Pal is a full-stack engineer and the co-founder &amp; CTO of DaemonHive Technologies. He builds scalable web platforms with React, Node.js, MongoDB and AWS."
    />
    <meta name="author" content="Samarth Kumar Pal" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="q2SdwF1dF1KCs4hPPtjAmLIUE852NDRT05GLwdUiTxE" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://samarthpal.github.io/" />

    <!-- Google's result favicon needs a square PNG/ICO that's a multiple of 48px; browsers prefer the SVG -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samarthpal.github.io/" />
    <meta property="og:title" content="Samarth Pal — Co-founder &amp; CTO, DaemonHive Technologies" />
    <meta property="og:description" content="Full-stack engineer, co-founder and CTO. Scalable systems, small bundles, curious interfaces." />
    <meta property="og:image" content="https://samarthpal.github.io/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Samarth Pal — Co-founder &amp; CTO, DaemonHive Technologies" />
    <meta name="twitter:description" content="Full-stack engineer, co-founder and CTO. Scalable systems, small bundles, curious interfaces." />
    <meta name="twitter:image" content="https://samarthpal.github.io/og.png" />

    <script>
      // Old hash links (/#/work/x from early 3.0, /#/home etc. from 2.0) → clean URLs, before React starts.
      ;(function () {
        var h = location.hash
        if (h.indexOf('#/') !== 0) return
        var path = h.slice(1)
        if (/^\/(home|about|resume|skills|portfolio|contact)?\/?$/.test(path)) path = '/'
        history.replaceState(null, '', path)
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@400;600;800&display=swap"
    />

    <style>
      /* critical paint: no white flash before the CSS bundle lands */
      html,
      body {
        background: #0b0b0c;
        color: #ecebe6;
        margin: 0;
      }
    </style>
  </head>

    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
